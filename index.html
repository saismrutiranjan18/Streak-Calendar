<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Streak Calendar</title>
    <!-- Bootstrap CSS -->
    <link href="https://stackpath.bootstrapcdn.com/bootstrap/4.5.2/css/bootstrap.min.css" rel="stylesheet">
    <style>
        /* Custom styles for the calendar */
        .calendar {
            display: grid;
            grid-template-columns: repeat(7, 1fr);
            gap: 5px;
            padding: 10px;
        }
        .day, .weekday {
            width: 100%;
            height: 40px;
            display: flex;
            align-items: center;
            justify-content: center;
            border-radius: 5px;
        }
        .weekday {
            font-weight: bold;
            background-color: #f8f9fa;
        }
        .day {
            background-color: #e9ecef;
            cursor: pointer;
        }
        .streak {
            background-color: #ffc107;
        }

        /* Dark mode styles */
        body.dark-mode {
            background-color: #121212;
            color: #ffffff;
        }
        .dark-mode .card {
            background-color: #1e1e1e;
            border-color: #333;
        }
        .dark-mode .card-header {
            background-color: #333;
            border-color: #444;
        }
        .dark-mode .weekday {
            background-color: #444;
            color: #fff;
        }
        .dark-mode .day {
            background-color: #555;
            color: #fff;
        }
        .dark-mode .streak {
            background-color: #ffc107;
            color: #000;
        }
        .dark-mode .form-control {
            background-color: #333;
            color: #fff;
            border-color: #555;
        }
        .dark-mode .btn-secondary {
            background-color: #555;
            border-color: #666;
        }
        .dark-mode .btn-success {
            background-color: #28a745;
            border-color: #28a745;
        }
    </style>
</head>
<body class="bg-light">
    <div class="container mt-5">
        <div class="card shadow">
            <div class="card-header bg-primary text-white">
                <h1 class="h3 mb-0">🔥 Streak Calendar</h1>
            </div>
            <div class="card-body">
                <button id="toggleDarkMode" class="btn btn-secondary mb-3">🌙 Dark Mode</button>
                <div class="form-row mb-3">
                    <div class="col">
                        <select id="year" class="form-control"></select>
                    </div>
                    <div class="col">
                        <select id="month" class="form-control"></select>
                    </div>
                </div>
                <div class="calendar" id="calendar"></div>
                <p class="mt-3">Current Streak: <span id="currentStreak" class="font-weight-bold">0</span> days</p>
                <button id="shareStreak" class="btn btn-success">📢 Share Achievement</button>
            </div>
        </div>
    </div>

    <!-- Bootstrap JS and dependencies -->
    <script src="https://code.jquery.com/jquery-3.5.1.slim.min.js"></script>
    <script src="https://cdn.jsdelivr.net/npm/@popperjs/core@2.5.2/dist/umd/popper.min.js"></script>
    <script src="https://stackpath.bootstrapcdn.com/bootstrap/4.5.2/js/bootstrap.min.js"></script>
    <script>
        document.addEventListener("DOMContentLoaded", () => {
            const calendar = document.getElementById("calendar");
            const currentStreakEl = document.getElementById("currentStreak");
            const toggleDarkMode = document.getElementById("toggleDarkMode");
            const shareStreak = document.getElementById("shareStreak");
            const yearSelect = document.getElementById("year");
            const monthSelect = document.getElementById("month");
            let streak = 0;
            
            // Populate year dropdown
            for (let y = 2023; y <= 2030; y++) {
                const option = document.createElement("option");
                option.value = y;
                option.textContent = y;
                yearSelect.appendChild(option);
            }
            
            // Populate month dropdown
            const months = ["January", "February", "March", "April", "May", "June", "July", "August", "September", "October", "November", "December"];
            months.forEach((m, index) => {
                const option = document.createElement("option");
                option.value = index;
                option.textContent = m;
                monthSelect.appendChild(option);
            });
            
            // Generate calendar
            function generateCalendar(year, month) {
                calendar.innerHTML = "";
                const weekdays = ["Sun", "Mon", "Tue", "Wed", "Thu", "Fri", "Sat"];
                weekdays.forEach(day => {
                    const weekday = document.createElement("div");
                    weekday.classList.add("weekday");
                    weekday.textContent = day;
                    calendar.appendChild(weekday);
                });
                
                let firstDay = new Date(year, month, 1).getDay();
                let daysInMonth = new Date(year, month + 1, 0).getDate();
                
                for (let i = 0; i < firstDay; i++) {
                    const emptyDay = document.createElement("div");
                    emptyDay.classList.add("day");
                    emptyDay.style.visibility = "hidden";
                    calendar.appendChild(emptyDay);
                }
                
                for (let i = 1; i <= daysInMonth; i++) {
                    const day = document.createElement("div");
                    day.classList.add("day");
                    day.textContent = i;
                    day.addEventListener("click", () => {
                        if (!day.classList.contains("streak")) {
                            day.classList.add("streak");
                            streak++;
                        } else {
                            day.classList.remove("streak");
                            streak--;
                        }
                        currentStreakEl.textContent = streak;
                    });
                    calendar.appendChild(day);
                }
            }
            
            // Event listeners for year and month changes
            yearSelect.addEventListener("change", () => generateCalendar(yearSelect.value, monthSelect.value));
            monthSelect.addEventListener("change", () => generateCalendar(yearSelect.value, monthSelect.value));
            
            // Initialize calendar with current year and month
            generateCalendar(new Date().getFullYear(), new Date().getMonth());
            
            // Toggle dark mode
            toggleDarkMode.addEventListener("click", () => {
                document.body.classList.toggle("dark-mode");
                document.querySelector(".card").classList.toggle("dark-mode");
                document.querySelector(".card-header").classList.toggle("dark-mode");
            });
            
            // Share streak
            shareStreak.addEventListener("click", () => {
                const text = `I have a streak of ${streak} days! 🔥 #StreakCalendar`;
                const url = `https://twitter.com/intent/tweet?text=${encodeURIComponent(text)}`;
                window.open(url, "_blank");
            });
        });
    </script>
</body>
</html>
